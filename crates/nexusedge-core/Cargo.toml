[package]
name = "nexusedge-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nexusedge-cas = { path = "../nexusedge-cas" }
nexusedge-crdt = { path = "../nexusedge-crdt" }
nexusedge-execution = { path = "../nexusedge-execution" }
nexusedge-telemetry = { path = "../nexusedge-telemetry" }
nexusedge-transport = { path = "../nexusedge-transport" }

clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
